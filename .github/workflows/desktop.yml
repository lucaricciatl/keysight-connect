name: desktop

# Builds the Electron app for macOS and Windows.
#  - on every push to a v* tag: uploads the artifacts to that GitHub release
#  - manually (workflow_dispatch): artifacts only, downloadable from the run
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install front-end dependencies
        working-directory: web
        run: npm ci

      - name: install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: build app
        working-directory: desktop
        run: npm run dist
        env:
          # no Developer ID on CI; after-pack.js ad-hoc signs the macOS bundle
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: list artifacts
        shell: bash
        run: ls -la desktop/release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.zip

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=$(ls desktop/release/*.dmg desktop/release/*.exe 2>/dev/null || true)
          if [ -z "$files" ]; then echo "no artifacts to upload"; exit 0; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Keysight Connect $tag" --generate-notes
          fi
          gh release upload "$tag" $files --clobber
